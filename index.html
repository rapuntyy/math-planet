<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="NZ4fWr2jOGWwBC5nq3muXV">
<head data-page-node-id="xhOPaKvOdZtg49kgH5YZ04">

<title>方方的数学星球 · 预览</title>
<style>
:root{
  --font-title:20px; --font-body:16px; --font-meta:14px;
  --bg:#F0F6FF; --card:#FFFFFF; --primary:#3B6FD4; --primary-2:#5B8DEF; --primary-soft:#E3EDFC;
  --deep:#1E3A6E; --text:#33415C; --muted:#8EA6C8; --star:#FFC94D; --star-deep:#B8860B;
  --orange:#FF9F5A; --green:#6FCF97; --pink:#F7A8C1; --border:#DCE8F8;
  --shadow:0 4px 14px rgba(59,111,212,.07);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
::selection{background:var(--star);color:#5C4400}
body{font-size:var(--font-body);line-height:1.6;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center}
#phone{width:100%;max-width:430px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media(min-width:480px){#phone{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
#screen{flex:1;overflow-y:auto;padding:16px 16px 96px}
.card{background:var(--card);border:1px solid rgba(220,232,248,.85);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card.mini{box-shadow:0 2px 8px rgba(59,111,212,.05);padding:14px 16px;border-radius:18px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--font-meta);padding:3px 10px;border-radius:99px;background:var(--primary-soft);color:var(--primary);font-weight:500;line-height:1.5}
.chip.star{background:#FFF3D6;color:var(--star-deep)}.chip.green{background:#E2F6EA;color:#2E8B57}
.chip.pink{background:#FDE8F0;color:#C4537E}.chip.plain{background:#F0F6FF;color:var(--muted)}
.btn{border-radius:99px;text-align:center;font-weight:600;font-size:var(--font-body);padding:12px 0;cursor:pointer;border:none;flex:1;user-select:none;transition:transform .12s ease,box-shadow .2s ease;line-height:1.6}
.btn.primary{background:linear-gradient(135deg,var(--primary-2),var(--primary));color:#fff;box-shadow:0 5px 14px rgba(59,111,212,.32)}
.btn.star{background:var(--star);color:#7A5A00}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px dashed var(--border)}
.btn:active{transform:scale(.96)}
.btn.primary:active{box-shadow:0 2px 6px rgba(59,111,212,.28)}
h1{font-size:var(--font-title);color:var(--deep);line-height:1.4}h2{font-size:var(--font-title);color:var(--deep);line-height:1.4}h3{font-size:var(--font-body);color:var(--deep);line-height:1.6}
.muted{color:var(--muted);font-size:var(--font-meta);line-height:1.5}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
/* 星空顶栏 */
.skyhead{position:relative;margin:-16px -16px 16px;padding:20px 18px 26px;border-radius:0 0 30px 30px;
  background:linear-gradient(160deg,#2A4C90 0%,#3B6FD4 58%,#6FA0EC 100%);color:#fff;overflow:hidden;
  box-shadow:0 6px 18px rgba(42,76,144,.25)}
.skyhead h1{color:#fff;font-size:var(--font-title);letter-spacing:.5px;line-height:1.4}
.sky-sub{color:rgba(255,255,255,.85);font-size:var(--font-meta);margin-top:3px;line-height:1.5}
.astro-badge{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.94);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;
  box-shadow:0 4px 10px rgba(10,30,70,.28);animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.tk{position:absolute;color:#FFE9A8;animation:tw 2.6s ease-in-out infinite;pointer-events:none}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1.1)}}
.sky-planet{position:absolute;right:-26px;bottom:-34px;font-size:104px;color:rgba(255,255,255,.14);transform:rotate(-14deg);pointer-events:none}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;box-shadow:0 2px 6px rgba(59,111,212,.08);transition:transform .12s ease}
.icon-btn:active{transform:scale(.9)}
.icon-btn.sky{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;box-shadow:none}
/* 今日主角卡 */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px;
  background:linear-gradient(165deg,#EAF2FF 0%,#FFFFFF 78%);border:1px solid #D6E5FB;
  box-shadow:0 10px 24px rgba(59,111,212,.13)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:132px;height:132px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#DEEAFD,#BCD3F6);opacity:.35;pointer-events:none;z-index:0}
.hero>*{position:relative;z-index:1}
.hero-planet{position:absolute;right:6px;top:-6px;font-size:56px;color:rgba(59,111,212,.12);transform:rotate(-12deg);pointer-events:none;z-index:0}
.record-manage{display:block;margin-top:10px;padding:8px 12px;border:1px solid var(--border);border-radius:99px;background:var(--primary-soft);color:var(--primary);font-size:var(--font-meta);cursor:pointer;line-height:1.5}
.hero-content{margin-top:18px;overflow-wrap:anywhere}
.hero-title{font-size:var(--font-title);line-height:1.4;font-weight:700;color:var(--deep)}
.hero-play{font-size:var(--font-body);line-height:1.6;color:var(--text);margin-top:12px}
.hero .hero-line{font-size:var(--font-body);line-height:1.6}
.hero .tags{margin-top:16px;gap:7px}
.hero .chip{font-size:var(--font-meta);line-height:1.5}
.hero>.actions{margin-top:22px}
.hero>.actions .btn{font-size:var(--font-body);line-height:1.6}
.hero-line{font-size:var(--font-body);margin-top:8px;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.actions{display:flex;gap:10px;margin-top:16px}
.card.story{background:linear-gradient(160deg,#FFF6FA,#FFFFFF 70%);border-color:#F6DDE9}
.card.life{background:linear-gradient(160deg,#F2FBF5,#FFFFFF 70%);border-color:#D5EDDD}
.card.goal{background:linear-gradient(160deg,#FFF9EC,#FFFFFF 70%);border-color:#F3E6C2}
.goal-title{font-size:var(--font-body);font-weight:700;color:var(--primary);margin-top:8px;line-height:1.6}
.quick{display:flex;gap:10px;margin-top:2px}
.quick-item{flex:1;background:var(--card);border:1px solid rgba(220,232,248,.85);border-radius:18px;padding:12px 0 10px;text-align:center;font-size:var(--font-meta);cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease;line-height:1.5}
.quick-item:active{transform:scale(.94)}
.qi{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;margin:0 auto 5px}
.qi.b{background:var(--primary-soft);color:var(--primary)}
.qi.img{background:transparent}
.qi.y{background:#FFF3D6;color:var(--star-deep)}
.qi.o{background:#FFEFE3;color:#D9732B}
/* 页头（非今日页） */
.page-head{margin:4px 2px 14px}
.page-head h1{font-size:var(--font-title);display:flex;align-items:center;gap:8px;line-height:1.4}
.page-head h1 .ph-i{color:var(--primary);font-size:22px}
/* 底部 tab */
#tabbar{position:sticky;bottom:0;display:flex;background:#fff;box-shadow:0 -6px 18px rgba(30,58,110,.08)}
#tabbar .tb{flex:1;text-align:center;padding:8px 0 10px;font-size:var(--font-meta);color:var(--muted);cursor:pointer;line-height:1.5}
#tabbar .tb .ti{font-size:22px;display:inline-flex;padding:4px 16px;border-radius:99px;transition:background .2s ease,color .2s ease;margin-bottom:1px}
#tabbar .tb.on{color:var(--primary);font-weight:600}
#tabbar .tb.on .ti{background:var(--primary-soft)}
/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(24,44,86,.42);backdrop-filter:blur(2px);z-index:90;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;z-index:99;background:#fff;border-radius:26px 26px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;animation:pop .38s cubic-bezier(.2,.9,.3,1.12)}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:99px;background:#E4ECF8;margin:2px auto 14px}
@keyframes pop{from{transform:translate(-50%,64px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet-close{font-size:var(--font-meta);color:var(--muted);padding:4px 8px;cursor:pointer;line-height:1.5}
.goal-block{margin-top:12px;background:var(--bg);border-radius:14px;padding:12px 14px}
.goal-text{font-size:var(--font-body);margin-top:4px;line-height:1.6}
.dice-stage{text-align:center;padding:16px 0 10px}
.dice-cube{font-size:56px;color:var(--primary);display:inline-flex;width:104px;height:104px;align-items:center;justify-content:center;border-radius:28px;background:var(--primary-soft);box-shadow:inset 0 0 0 2px #C9DBF6}
.shaking{animation:shake .16s linear 5}
@keyframes shake{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-15deg) scale(1.07)}75%{transform:rotate(15deg) scale(1.07)}}
.dice-result{border:1.5px solid #F6D2E0;background:linear-gradient(160deg,#FFF5F9,#FFFFFF);animation:pop2 .35s cubic-bezier(.2,.9,.3,1.15)}
/* 打卡 */
.field{margin-top:16px}.field-label{font-size:var(--font-body);font-weight:600;color:var(--deep);margin-bottom:8px;line-height:1.6}
.stars{display:flex;gap:10px}
.rate-star{font-size:33px;color:#DCE8F8;cursor:pointer;transition:transform .16s cubic-bezier(.2,.9,.3,1.4),color .15s ease}
.rate-star.on{color:var(--star);transform:scale(1.18)}
.opts{display:flex;gap:8px}
.opt{flex:1;text-align:center;font-size:var(--font-meta);padding:9px 0;border-radius:99px;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .18s ease;line-height:1.5}
.opt.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600;box-shadow:0 3px 8px rgba(59,111,212,.18)}
.input,.textarea{background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;font-size:var(--font-body);width:100%;outline:none;transition:border-color .18s ease;line-height:1.6}
.input:focus,.textarea:focus{border-color:var(--primary)}
.textarea{min-height:70px;resize:vertical}
/* 游戏库 */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--border);border-radius:99px;padding:9px 14px;box-shadow:var(--shadow);color:var(--muted);transition:border-color .18s ease,box-shadow .18s ease}
.search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:var(--font-body);color:var(--text);line-height:1.6}
.tier-row,.ch-row{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px;scrollbar-width:none}
.tier-row::-webkit-scrollbar,.ch-row::-webkit-scrollbar{display:none}
.tier{flex-shrink:0;font-size:var(--font-meta);padding:7px 15px;border-radius:99px;background:var(--card);color:var(--muted);border:1px solid var(--border);cursor:pointer;transition:all .18s ease;line-height:1.5}
.tier.on{background:linear-gradient(135deg,var(--primary-2),var(--primary));color:#fff;border-color:transparent;font-weight:600;box-shadow:0 3px 9px rgba(59,111,212,.3)}
.ch{flex-shrink:0;font-size:var(--font-meta);padding:5px 12px;border-radius:99px;background:transparent;color:var(--muted);border:1px dashed var(--border);cursor:pointer;transition:all .18s ease;line-height:1.5}
.ch.on{background:var(--primary-soft);color:var(--primary);border-style:solid;border-color:var(--primary)}
.g-name{font-size:var(--font-body);font-weight:700;color:var(--deep);line-height:1.6}
.g-mat{font-size:var(--font-body);margin-top:4px;line-height:1.6}
.card.tappable{cursor:pointer;transition:transform .13s ease}
.card.tappable:active{transform:scale(.98)}
/* 详情 */
.detail-cover{position:fixed;inset:0;background:var(--bg);z-index:80;overflow-y:auto;padding:16px 16px 60px;left:50%;transform:translateX(-50%);width:100%;max-width:430px}
.card.d-hero{background:linear-gradient(160deg,#FFF8E6,#FFFFFF 75%);border-color:#F3E3B5;margin-top:12px}
.kv{display:flex;margin-top:8px;font-size:var(--font-body);line-height:1.6}.kv-k{width:80px;color:var(--muted);flex-shrink:0}
/* 记录 */
.stat-cards{display:flex;gap:8px;margin-top:12px}
.stat-card{flex:1;background:var(--card);border:1px solid rgba(220,232,248,.85);border-radius:16px;padding:14px 0;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-size:var(--font-title);font-weight:700;background:linear-gradient(135deg,var(--primary-2),var(--primary));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.4}
.stat-label{font-size:var(--font-meta);color:var(--muted);margin-top:2px;line-height:1.5}
.heat{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0 6px}
.heat-cell{width:16px;height:16px;border-radius:5px;background:#EDF3FC}
.bar-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.bar-name{width:66px;font-size:var(--font-meta);flex-shrink:0;color:var(--deep);line-height:1.5}
.bar-track{flex:1;height:12px;background:#EDF3FC;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--primary-2),var(--primary));border-radius:99px}
.bar-count{width:24px;font-size:var(--font-meta);color:var(--muted);text-align:right;line-height:1.5}
.rank{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:var(--font-body);line-height:1.6}
.rank-star{color:var(--star);font-size:var(--font-meta);display:inline-flex;align-items:center;gap:3px;line-height:1.5}
.rec-title{font-size:var(--font-body);font-weight:600;color:var(--deep);line-height:1.6}
.empty{text-align:center;color:var(--muted);font-size:var(--font-body);padding:40px 0;line-height:1.6}
.guide-line{font-size:var(--font-body);line-height:1.6;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.chev{display:inline-flex;align-items:center;color:var(--muted);transition:transform .25s ease}
.chev.up{transform:rotate(180deg)}
.tabseg{display:flex;gap:8px;margin-bottom:12px}
.tabseg .ts{flex:1;text-align:center;font-size:var(--font-meta);padding:9px 0;border-radius:99px;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .18s ease;line-height:1.5}
.tabseg .ts.on{background:linear-gradient(135deg,var(--primary-2),var(--primary));color:#fff;border-color:transparent;font-weight:600;box-shadow:0 3px 9px rgba(59,111,212,.3)}

/* 使用指南结构化 */
.g-sub{font-size:var(--font-meta);color:var(--muted);line-height:1.5;margin-top:10px}
.g-card{background:var(--bg);border-radius:14px;padding:6px 14px;margin-top:10px}
.g-card.g-mini{padding:12px 14px}
.g-kv{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed var(--border)}
.g-kv:last-child{border-bottom:none}
.g-key{flex-shrink:0;width:92px;font-size:var(--font-meta);color:var(--primary);font-weight:600;line-height:1.5}
.g-val{font-size:var(--font-body);line-height:1.6}
.g-sec{font-size:var(--font-body);font-weight:700;color:var(--deep);margin:18px 0 4px;display:flex;align-items:center;gap:6px;line-height:1.6}
.g-sec-note{font-size:var(--font-meta);font-weight:400;color:var(--muted);margin-left:2px;line-height:1.5}
.g-prin{display:flex;gap:10px;background:var(--bg);border-radius:14px;padding:12px;margin-top:8px}
.g-num{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--primary-2),var(--primary));color:#fff;font-size:var(--font-meta);font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;line-height:1.5}
.g-prin-t{font-size:var(--font-body);font-weight:600;color:var(--deep);line-height:1.6}
.g-prin-d{font-size:var(--font-body);color:var(--muted);line-height:1.6;margin-top:3px}
.g-meta{font-size:var(--font-meta);color:var(--muted);margin-top:8px;line-height:1.5}
.g-sub2{font-size:var(--font-meta);color:var(--muted);margin:2px 0 4px;line-height:1.5}

/* 星星点缀 */
.divider-star{display:flex;align-items:center;gap:10px;margin:2px 0 14px;color:#C9DBF6}
.divider-star::before,.divider-star::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#D6E5FB)}
.divider-star::after{background:linear-gradient(90deg,#D6E5FB,transparent)}
.divider-star .di{font-size:13px;color:var(--star);animation:tw 2.8s ease-in-out infinite}
.ph-star{color:var(--star);font-size:14px;animation:tw 3s ease-in-out infinite}
.hero-star{position:absolute;color:#FFD97A;animation:tw 2.8s ease-in-out infinite;pointer-events:none;z-index:1}
.dice-stage{position:relative}
.dice-star{position:absolute;color:var(--star);animation:tw 2.4s ease-in-out infinite;pointer-events:none}

/* 次级卡片星星底色 */
.card.mini{position:relative;overflow:hidden}
.mini-star{position:absolute;animation:tw 3s ease-in-out infinite;pointer-events:none;z-index:0}
.plus-btn{width:30px;height:30px;border-radius:50%;border:1.5px dashed #F2A9C4;background:#fff;color:#E86A9C;display:inline-flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;transition:all .22s ease;flex-shrink:0;padding:0}
.plus-btn:hover{transform:scale(1.08)}
.plus-btn.on{background:#F7A8C1;color:#fff;border-style:solid;border-color:transparent;transform:rotate(45deg)}
.card.diary{background:linear-gradient(160deg,#FFFBEC,#FFFFFF 72%);border-color:#F6E3B4}
.dtype-row{display:flex;gap:8px;margin-top:10px}
.dtype{padding:5px 14px;border-radius:999px;border:1.5px dashed #E8D29A;color:#8A6D1F;font-size:var(--font-meta);font-weight:600;cursor:pointer;background:#fff;transition:all .18s ease;line-height:1.5}
.dtype.on{background:#F5C453;color:#fff;border-style:solid;border-color:transparent;box-shadow:0 3px 8px rgba(245,196,83,.35)}
.diary-list{margin-top:12px;display:flex;flex-direction:column;gap:8px;position:relative}
.diary-item{display:flex;gap:8px;align-items:flex-start;background:rgba(255,255,255,.75);border:1px dashed #F0DFAF;border-radius:12px;padding:8px 10px}
.diary-t{font-size:var(--font-body);font-weight:600;line-height:1.6}
.dtype.sm{padding:2px 8px;font-size:var(--font-meta);cursor:default;flex-shrink:0;border-style:solid;background:#F5C453;color:#fff;border-color:transparent;line-height:1.5}
[data-rid]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.btn.danger{color:#E1564A;border-color:#F3C1BC}
.week-block{border:1.5px solid var(--border);border-radius:16px;padding:12px 14px;margin-top:10px;background:#fff}
.week-block.cur{border-color:var(--primary);background:linear-gradient(160deg,#F4F9FF,#FFFFFF)}
.week-num{font-weight:800;color:var(--deep);font-size:var(--font-body);line-height:1.6}
/* 我的 */
.card.me-card{background:linear-gradient(150deg,#2A4C90,#5B8DEF);border:none;color:#fff;overflow:hidden;position:relative}
.card.me-card h2{color:#fff}
.card.me-card .muted{color:rgba(255,255,255,.82)}
.me-planet{position:absolute;right:-18px;bottom:-26px;font-size:88px;color:rgba(255,255,255,.16);transform:rotate(-14deg);pointer-events:none}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;font-size:var(--font-meta);padding:9px 18px;border-radius:99px;z-index:200;animation:pop2 .25s;box-shadow:0 6px 16px rgba(30,58,110,.35);line-height:1.5}
@keyframes pop2{from{opacity:0;top:40px}to{opacity:1;top:60px}}

/* 三档文字层级的窄屏排版 */
.skyhead>.row{flex-wrap:wrap;gap:12px}
.skyhead>.row>.row:first-child{flex:1 1 220px;min-width:0}
.row>div,.row>.input,.search input{min-width:0}
.g-sec{flex-wrap:wrap}

/* ---------- 存储 ---------- */
const LS = 'mathPlanetPreview.v1';
function load(){ try{ return JSON.parse(localStorage.getItem(LS)) || null }catch(e){ return null } }
function save(s){ try{ localStorage.setItem(LS, JSON.stringify(s)); return true; }catch(e){ return false; } }
let S = load() || { records:[], gameState:{}, overrides:{}, childName:'方方' };
function updateState(change){
  const next=JSON.parse(JSON.stringify(S));
  change(next);
  if(!save(next)){ toast('保存失败，请检查浏览器存储空间后重试，已保存的数据和当前输入已保留'); return false; }
  S=next; return true;
}
function updateSetting(key,value){
  if(!['childName','bookName'].includes(key)) return;
  const next=value.trim()||(key==='childName'?'方方':'');
  if(updateState(s=>{s[key]=next;})&&key==='childName') render();
}
function validDate(value){
  return typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)&&Number.isFinite(Date.parse(value+'T12:00:00Z'))&&new Date(value+'T12:00:00Z').toISOString().slice(0,10)===value;
}
function validEntry(date,duration){
  if(!validDate(date)||date>todayStr()){toast('请选择今天或以前的有效日期');return false;}
  if(duration!==''&&duration!==undefined&&(!String(duration).trim()||!Number.isFinite(Number(duration))||Number(duration)<0)){toast('时长请填写 0 或以上的分钟数');return false;}
  return true;
}

/* ---------- 日期 ---------- */
const pad = n => n<10 ? '0'+n : ''+n;
const todayStr = (d) => { if (!d && window.QA_DATE) return window.QA_DATE; d = d || new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const WD = ['周日','周一','周二','周三','周四','周五','周六'];
function streak(){
  const days=[...new Set(S.records.map(r=>r.date))].sort().reverse();
  if(!days.length) return 0;
  let c=new Date((window.QA_DATE||todayStr())+'T12:00:00'), n=0;
  if(days[0]!==todayStr(c)){ c.setDate(c.getDate()-1); if(days[0]!==todayStr(c)) return 0; }
  for(;;){ if(days.includes(todayStr(c))){ n++; c.setDate(c.getDate()-1);} else break; }
  return n;
}

/* ---------- 骰子加权随机 ---------- */
const TIER={当前主线:3,下一阶段:2,后续:1}, STF={未开始:1.2,尝试中:1,已玩:0.7,熟练:0.3};
function pickGame(exclude){
  const cutoff=new Date(todayStr()+'T12:00:00'); cutoff.setDate(cutoff.getDate()-7);
  const cut=todayStr(cutoff);
  const recent=S.records.filter(r=>r.date>=cut&&r.date<=todayStr()).map(r=>r.gameCode);
  const pool=DATA.games.filter(g=>g.card_type!=='教具卡'&&g.code!==exclude);
  const items=pool.map(g=>{
    const st=S.gameState[g.code]||{};
    let w=(TIER[g.plan_tier]||1)*(STF[st.status||'未开始']||1);
    if(recent.includes(g.code)) w*=0.2;
    const d2=(st.diffs||[]).slice(-2);
    if(d2.length&&d2.every(d=>d===3)) w*=0.5;
    return {g,w};
  });
  let r=Math.random()*items.reduce((s,x)=>s+x.w,0);
  for(const x of items){ r-=x.w; if(r<=0) return x.g; }
  return items[items.length-1].g;
}

/* ---------- 打卡 ---------- */
let recordSequence=0;
function checkin(rec,updates={}){
  if(!validEntry(rec.date,rec.duration)) return false;
  let id; do{id='r'+Date.now()+'-'+(++recordSequence);}while(S.records.some(r=>r.id===id));
  const kind=rec.kind||(String(rec.gameName).startsWith('绘本时光：')?'book':String(rec.gameName).startsWith('数学日记·')?'diary':'game');
  const entry={...rec,id,kind,createdAt:new Date().toISOString()};
  return updateState(next=>{Object.assign(next,updates);next.records.unshift(entry);recomputeState(next);});
}
function currentActivityDone(date,plan,game){
  return S.records.some(r=>{
    if(r.date!==date) return false;
    if(r.kind&&r.kind!=='game') return false;
    if(!r.kind&&/^(绘本时光：|数学日记·)/.test(r.gameName||'')) return false;
    return game?r.gameCode===game.code:!!plan&&!r.gameCode&&(r.planDate===date||(!r.planDate&&r.gameName===plan.goal));
  });
}
function referenceWeek(plan){
  return DATA.weekly.find(w=>w.week_no===S.referenceWeek)||(plan?DATA.weekly.find(w=>w.week_no===plan.week_no):null);
}
function setReferenceWeek(week){
  if(week&&!DATA.weekly.some(w=>w.week_no===week))return;
  if(!updateState(next=>{next.referenceWeek=week;}))return;
  sheet=null;render();toast(week?'已选择参考周':'已取消参考周');
}
function explorationCard(){
  const games=DATA.games.filter(g=>g.plan_tier==='当前主线'&&g.card_type!=='教具卡');
  const played=new Set(S.records.map(r=>r.gameCode));
  const count=games.filter(g=>played.has(g.code)).length;
  return '<div class="card mini goal"><h3>'+icon('target')+' 自由探索</h3><div class="goal-title">当前主线已玩 '+count+' / '+games.length+' 个活动</div><div class="muted" style="margin-top:6px">挑一个感兴趣的活动，也可以选择一周作为陪玩参考。</div><div class="actions"><button class="btn ghost" onclick="openSheet(&quot;weeks&quot;)">查看全部周计划</button></div></div>';
}

  document.body.appendChild(t); setTimeout(()=>t.remove(),1800);
}


/* 使用指南：把“|”分隔的原始文本渲染成结构化卡片（DATA 不变，仅在渲染层清洗） */
function buildGuide(){
  const L=DATA.guide.map(s=>String(s).trim());
  const split=l=>l.split(/[｜|]/).map(x=>x.trim()).filter(Boolean);
  const iPrin=L.findIndex(l=>l.startsWith('三个使用原则'));
  const iMethod=L.findIndex(l=>l.startsWith('第一章方法论卡'));
  const iRoute=L.findIndex(l=>l.startsWith('融合后的数学路线'));
  let h=`<div class="g-sub">${esc(disp(L[1]||''))}</div>`;
  // 概览区：原则之前的 key|value 行
  const kvEnd=iPrin>0?iPrin:L.length;
  h+='<div class="g-card">'+L.slice(2,kvEnd).map(l=>{const c=split(l);
    return `<div class="g-kv"><span class="g-key">${esc(disp(c[0]))}</span><span class="g-val">${esc(disp(c.slice(1).join(' ')))}</span></div>`}).join('')+'</div>';
  // 三个使用原则（丢弃行尾纯数字残渣如“18”）
  if(iPrin>=0){
    h+=`<div class="g-sec"><span style="color:var(--star)">${icon('star-fill')}</span>三个使用原则</div>`;
    h+=L.slice(iPrin+1,iMethod>0?iMethod:L.length).map(l=>{const c=split(l).filter((x,i)=>!(i>0&&/^\d+$/.test(x)));
      return `<div class="g-prin"><span class="g-num">${esc(disp(c[0]))}</span><div><div class="g-prin-t">${esc(disp(c[1]||''))}</div><div class="g-prin-d">${esc(disp(c[2]||''))}</div></div></div>`}).join('');
  }
  // 第一章方法论卡
  if(iMethod>=0){
    h+=`<div class="g-sec"><span style="color:var(--primary)">${icon('book')}</span>第一章方法论卡<span class="g-sec-note">陪伴原则，不计入清单</span></div>`;
    h+=L.slice(iMethod+1,iRoute>0?iRoute:L.length).map(l=>{const c=split(l);
      return `<div class="g-card g-mini"><div class="g-prin-t">${esc(disp(c[0]))}</div><div class="g-prin-d">${esc(disp(c[1]||''))}</div>${c[2]?`<span class="chip plain" style="margin-top:6px">${esc(disp(c.slice(2).join('，')))}</span>`:''}</div>`}).join('');
  }
  // 融合后的数学路线
  if(iRoute>=0){
    const rt=split(L[iRoute]);
    h+=`<div class="g-sec"><span style="color:var(--primary)">${icon('rocket')}</span>${esc(disp(rt[0]))}</div><div class="g-sub2">${esc(disp(rt[1]||''))}</div>`;
    h+=L.slice(iRoute+1).map(l=>{const c=split(l);
      if(c.length<3||(c[0]==='层级'&&c[1]==='材料')) return '';
      return `<div class="g-card g-mini"><div class="row between"><span class="g-prin-t">${esc(disp(c[0]))}</span><span class="chip">${esc(disp(c[1]))}</span></div>
      <div class="g-prin-d">${esc(disp(c[2]))}</div>
      <div class="g-meta">${icon('calendar')} ${esc(disp(c[3]||''))}${c[4]?' · '+esc(disp(c[4])):''}</div></div>`}).join('');
  }
  return h;
}

}
function buildLibraryResults(){
  let list=DATA.games;
  if(lib.tier!=='全部') list=list.filter(g=>g.plan_tier===lib.tier);
  if(lib.ch) list=list.filter(g=>g.chapter+'｜'+g.chapter_name===lib.ch);
  const keyword=lib.kw.trim();
  if(keyword) list=list.filter(g=>g.name.includes(keyword)||g.materials.includes(keyword)||(g.concepts||[]).some(c=>c.includes(keyword)));
  return `
  <div class="muted" style="margin:12px 4px 8px">共 ${list.length} 个</div>
  ${list.map(g=>{const st=(S.gameState[g.code]||{}).status||g.status;return `
    <div class="card tappable" onclick="openDetail('${g.code}')">
      <div class="row between"><span class="g-name">${esc(g.name)}</span><span class="chip plain">${g.code}</span></div>
      <div class="g-mat">${esc(g.materials)}</div>
      <div class="tags"><span class="chip">${esc(g.form)}</span><span class="chip plain">${esc(g.num_range.raw)}</span><span class="chip green">${esc(g.dev_level)}</span>${g.card_type==='教具卡'?'<span class="chip pink">教具卡</span>':''}${st!=='未开始'?`<span class="chip star">${st}</span>`:''}</div>
    </div>`}).join('')||'<div class="empty">没有找到匹配的游戏，换个关键词试试</div>'}`;
}
function updateLibrarySearch(input,event){
  if(event&&event.isComposing)return;
  lib.kw=input.value;
  const results=document.getElementById('libraryResults');
  if(results)results.innerHTML=buildLibraryResults();
}

    <div class="stat-cards">
      <div class="stat-card"><div class="stat-num">${recs.length}</div><div class="stat-label">总次数</div></div>
      <div class="stat-card"><div class="stat-num">${streak()}</div><div class="stat-label">连续天数</div></div>

/* 由记录重算游戏进度（删除/编辑后调用，保持一致） */
function recomputeState(state=S){
  const gs={};
  [...state.records].sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.createdAt||'').localeCompare(String(b.createdAt||''))).forEach(r=>{
    if(!r.gameCode) return;
    const g=gs[r.gameCode]||{status:'未开始',times:0,likes:[],diffs:[]};
    g.times++; g.lastPlayed=r.date;
    if(r.like) g.likes.push(r.like);
    if(r.difficulty) g.diffs.push(r.difficulty);
    if(g.times>=4){ const l2=g.diffs.slice(-2); g.status=(l2.length===2&&l2.every(d=>d<=2))?'熟练':'尝试中'; }
    else if(g.times>=2) g.status='尝试中'; else g.status='已玩';
    gs[r.gameCode]=g;
  });
  state.gameState=gs;
}

function validateBackup(o){
  const object=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
  const invalid=()=>{ throw new Error('备份格式无效'); };
  const text=(v,fallback='')=>{ if(v===undefined) return fallback; if(typeof v!=='string') invalid(); return v; };
  const date=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&Number.isFinite(Date.parse(v+'T12:00:00Z'))&&new Date(v+'T12:00:00Z').toISOString().slice(0,10)===v;
  const rating=(v,max)=>{ if(v===undefined) return 0; if(!Number.isInteger(v)||v<0||v>max) invalid(); return v; };
  const knownCode=v=>Object.prototype.hasOwnProperty.call(gameByCode,v);
  if(!object(o)||!Array.isArray(o.records)) invalid();
  const ids=new Set();
  const records=o.records.map(r=>{
    if(!object(r)||!date(r.date)) invalid();
    const id=text(r.id); if(!id.trim()||ids.has(id)) invalid(); ids.add(id);
    const gameCode=text(r.gameCode); if(gameCode&&!knownCode(gameCode)) invalid();
    const duration=r.duration===undefined?'':r.duration;
    // 旧版表单允许负数；恢复时保留已有数值，避免单条旧记录阻断整份备份。
    if(!['string','number'].includes(typeof duration)||(duration!==''&&(!String(duration).trim()||!Number.isFinite(Number(duration))))) invalid();
    const createdAt=text(r.createdAt,r.date+'T12:00:00.000Z');
    if(!Number.isFinite(Date.parse(createdAt))) invalid();
    const metadata={};
    if(r.kind!==undefined){if(!['game','book','diary'].includes(r.kind))invalid();metadata.kind=r.kind;}
    if(r.planDate!==undefined){if(!date(r.planDate))invalid();metadata.planDate=r.planDate;}
    return {id,date:r.date,gameCode,gameName:text(r.gameName),like:rating(r.like,5),difficulty:rating(r.difficulty,3),focus:rating(r.focus,3),duration:String(duration),note:text(r.note),createdAt,...metadata};
  });
  const overrides={};
  if(o.overrides!==undefined){
    if(!object(o.overrides)) invalid();
    for(const [day,entry] of Object.entries(o.overrides)){
      if(!date(day)||!object(entry)||typeof entry.gameCode!=='string'||!knownCode(entry.gameCode)) invalid();
      overrides[day]={gameCode:entry.gameCode,from:text(entry.from,'manual')};
    }
  }
  const referenceWeek=text(o.referenceWeek);
  if(referenceWeek&&!DATA.weekly.some(w=>w.week_no===referenceWeek))invalid();
  const state={records,gameState:{},overrides,childName:text(o.childName,'方方').trim()||'方方',bookName:text(o.bookName),referenceWeek};
  recomputeState(state);
  return state;
}
function importData(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
      const raw=JSON.parse(rd.result), next=validateBackup(raw);
      const legacy=['overrides','childName','bookName'].some(k=>raw[k]===undefined);
      if(!confirm('将导入 '+next.records.length+' 条记录，并替换当前记录、昵称、绘本名、活动选择和参考周。'+(legacy?'此备份缺失的设置将恢复默认。':'')+'建议先导出备份。确定导入？')) return;
      if(!save(next)){ toast('保存失败，请检查浏览器存储空间后重试，原记录已保留'); return; }
      S=next; sheet=null; detailCode=null; recAct=null; recConfirm=false;
      render(); toast('导入成功，欢迎回来');
    }catch(e){ toast('文件格式不对，导入失败，原记录已保留'); }
    finally{ inp.value=''; }
  };
  rd.onerror=rd.onabort=()=>{ inp.value=''; toast('文件读取失败，请重新选择备份，原记录已保留'); };
  rd.readAsText(f);
}

function go(t){ tab=t; detailCode=null; sheet=null; render(); document.getElementById('screen').scrollTop=0; }
function openSheet(s){ sheet=s; if(s==='dice'){diceGame=null;rolling=false;} render(); }
function openDetail(code){ detailCode=code; render(); }
function exportData(){
  const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),records:S.records,gameState:S.gameState,overrides:S.overrides,childName:S.childName,bookName:S.bookName||'',referenceWeek:S.referenceWeek||''},null,1)],{type:'application/json'});
  const a=document.createElement('a'); const url=URL.createObjectURL(blob);
  a.href=url; a.download='math-planet-backup.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function resetAll(){
  if(confirm('会删除所有打卡记录和进度（游戏库本身保留），不可恢复。确定清空？')){
    if(!updateState(next=>{next.records=[];next.gameState={};next.overrides={};}))return;
    render();toast('已清空');
  }
}

/* 详情页点打卡时带上游戏信息 */
const _origRenderOverlay=renderOverlay;
renderOverlay=function(){
  document.querySelectorAll('.mask,.sheet,.detail-cover').forEach(e=>e.remove());
  if(detailCode){ document.body.appendChild(buildDetail(detailCode)); return; }
  if(!sheet) return;
  const mask=document.createElement('div'); mask.className='mask'; mask.onclick=()=>{sheet=null;render();};
  document.body.appendChild(mask);
  let el;
  if(sheet==='goals') el=buildGoals();
  else if(sheet==='dice') el=buildDice();
  else if(sheet==='recact') el=buildRecAct();
  else if(sheet==='recedit') el=buildRecEdit();
  else if(sheet==='weeks') el=buildWeeks();
  else el=buildCheckin(window._ckCode, window._ckName), window._ckCode=undefined, window._ckName=undefined;
  document.body.appendChild(el);
};

/* 长按时间线记录 → 操作菜单（触摸 550ms / 鼠标左键 550ms） */
let lpTimer=null, lpGuard=null;
const lpStart=e=>{ const c=e.target.closest&&e.target.closest('[data-rid]'); if(!c) return; const rid=c.dataset.rid;
  const x=e.clientX||(e.touches&&e.touches[0]&&e.touches[0].clientX)||0, y=e.clientY||(e.touches&&e.touches[0]&&e.touches[0].clientY)||0;
  clearTimeout(lpTimer);
  lpTimer=setTimeout(()=>{ lpGuard={x:x,y:y,t:Date.now()}; recAct=rid; recConfirm=false; sheet='recact'; render(); },550); };
const lpEnd=()=>clearTimeout(lpTimer);
document.addEventListener('touchstart',lpStart,{passive:true});
document.addEventListener('touchend',lpEnd);
document.addEventListener('touchmove',lpEnd);
document.addEventListener('mousedown',e=>{ if(e.button===0) lpStart(e); });
document.addEventListener('mouseup',lpEnd);
document.addEventListener('click',e=>{ if(lpGuard&&Date.now()-lpGuard.t<1500&&Math.hypot(e.clientX-lpGuard.x,e.clientY-lpGuard.y)<40){ lpGuard=null; e.stopPropagation(); e.preventDefault(); } },true);
document.addEventListener('contextmenu',e=>{ if(e.target.closest&&e.target.closest('[data-rid]')) e.preventDefault(); });

render();
</script>
